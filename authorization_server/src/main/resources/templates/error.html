<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, shrink-to-fit=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="Title" content="Error Page" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <link rel="icon" th:href="@{/static/images/favicon.gif}" type="image/gif" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/static/personalized.css}" media="all" type="text/css" />

    <meta name="referrer" content="no-referrer">
    <title>Error Page</title>
</head>


<body id="responsive-main-nav1">
<div class="main">
    <header role="banner" class="main-header shadow-sm">
        <div class="container">
            <div class="container-fluid p-0" id="header-container">
                <div class="navbar-brand col-md-12">
                    <img th:src="@{/static/images/ic-logo.svg}" alt="Logo" height="45" />
                </div>
            </div>
        </div>
    </header>

    <div class="container-fluid h-80">
        <div class="content-box col-md-8 mx-auto">
            <h1>Something went wrong! </h1>
            <div class="genericErrors" id="genericErrorsDesc"></div>

            <div class="text-center col-md-11">
                <p th:text="${errormessage}" style="font-size: 15px;">error message</p>
                <p th:text="${erroradditionalinfo}"
                   th:if="${erroradditionalinfo != null && !#strings.isEmpty(erroradditionalinfo)}"
                   style="font-size: 12px; padding-top: 40px; color: #666;"
                 >here</p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
