services:
  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${SPRING_DATASOURCE_DB_NAME}
      MYSQL_USER: ${SPRING_DATASOURCE_USERNAME}
      MYSQL_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./tools/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    env_file:
      - .env

  authorization_server:
    build:
      context: .
      dockerfile: authorization_server/Dockerfile
    container_name: authorizationserver
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8084:8084"
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_DB_URL: mysql:3306
      SPRING_PROFILES_ACTIVE: docker
    volumes:
      - ./config_files:/opt/app/config/config_files
      - ./logs:/opt/app/logs
    command: ["--spring.config.additional-location=file:/opt/app/config/config_files/application-secret.yml"]

  resource_server:
    build:
      context: .
      dockerfile: resource_server/Dockerfile
    container_name: resourceserver
    depends_on:
      mysql:
        condition: service_healthy
      authorization_server:
        condition: service_started
    ports:
      - "8085:8085"
    volumes:
      - ./hsm:/opt/app/config/hsm/
      - ./ejbca/:/opt/app/config/ejbca/
      - ./certificates:/opt/app/certificates
      - ./logs:/opt/app/logs
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_DB_URL: mysql:3306
      SPRING_PROFILES_ACTIVE: docker

volumes:
  mysql_data:
